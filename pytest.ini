[pytest]
testpaths = tests
addopts = -ra --strict-markers --junitxml=reports/test-results.xml
markers =
    api: HTTP API functional test
    security: security-focused test
    concurrency: concurrent behavior test
    case(id): maps an automated test to a test case ID
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-7s | %(name)s | %(message)s
filterwarnings =
    ignore::DeprecationWarning

